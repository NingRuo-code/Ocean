[project]
name = "ocean-front-backend"
version = "0.1.0"
description = "Offline data service for the ocean front analysis prototype"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "xarray>=2025.6,<2027",
  "h5netcdf>=1.6,<2",
  "h5py>=3.14,<4",
  "numpy>=2.2,<3",
  "pydantic-settings>=2.10,<3",
  "remotezip>=0.12,<1",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = [
  "ignore:Using `httpx` with `starlette.testclient` is deprecated.*:Warning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
